[context]
json_path = "./workspace/764-ef5c5c99/context.json"
result_path = "./workspace/cr_result/764-ef5c5c99"

[project]
language = "TypeScript"
status = "update"
guidelines_path = "./workspace/guidelines_docs/TypeScript.md"
requirements_path = ""

[llm]
model = "anthropic/claude-sonnet-4-5"
api_key = ""
api_base = ""
use_litellm_gateway = true
gateway_provider = "openai"

# 可选 git 配置。token 为全局兜底,per-task context.json 的 git_token 优先级更高。
# 日志只记 configured/短 hash,绝不打印明文。allow_network 默认关闭。
[git]
token = ""
timeout_s = 30
allow_network = false

[tools.crg]
enabled = false
base_dir = ".crg"
target_root = ""
max_retry = 3
retry_interval_s = 1.0
timeout_s = 60

# 各子 agent 单次模型调用超时(秒)。summary 输入/输出最大,默认 300s。
[timeouts]
context_s = 300
dimension_s = 300
summary_s = 300

# 可选值: gitlab / infcode
platform = "gitlab"
